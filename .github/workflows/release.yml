name: Release

# Pushing a tag such as v0.9.0 (or v1.0.0-beta.1) tests, builds, signs and publishes that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the update signing key is set
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error title=UPDATE_SIGNING_KEY is missing::Add the repository secret UPDATE_SIGNING_KEY (see Scripts/make-update-key.sh). Without it the release can't be signed, and installed copies would refuse it."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Check the tag is a version with notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi
          if ! grep -Eq "^## \[?$VERSION\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' section."
            exit 1
          fi
          if [ ! -f Resources/UpdatePublicKey.txt ]; then
            echo "::error::Resources/UpdatePublicKey.txt isn't committed. Run Scripts/make-update-key.sh and commit it."
            exit 1
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build, zip and sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: Scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Analytics Desktop $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag $FLAGS \
            "dist/AnalyticsDesktop-$VERSION.zip" \
            "dist/AnalyticsDesktop-$VERSION.zip.sig" \
            dist/latest.json
