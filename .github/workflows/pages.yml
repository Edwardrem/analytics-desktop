name: Pages

# Publishes site/ to GitHub Pages. In the repository settings, Pages ▸ Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "STATUS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pages
        run: python3 -I site/check.py

      - name: Generate the feature status from STATUS.md
        run: |
          mkdir -p site/data
          python3 -I site/tools/status_json.py STATUS.md site/data/status.json

      - name: Assemble the site (without the check and generator scripts)
        run: |
          mkdir _site
          rsync -a --exclude '*.py' --exclude 'tools/' --exclude '.gitignore' --exclude '.gitkeep' site/ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
